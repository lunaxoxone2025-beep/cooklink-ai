name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Fonts (SIL Open Font License) come straight from the Google Fonts repository.
      - name: Download fonts
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL --retry 3 -o app/src/main/res/font/unbounded.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o app/src/main/res/font/space_grotesk.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          ls -la app/src/main/res/font

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CookLinkAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CookLinkAI
          path: CookLinkAI.apk

      # A release page is the easiest place to download the APK from a phone.
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CookLink AI – latest build
          prerelease: true
          make_latest: false
          body: "Build of commit ${{ github.sha }}. On your phone: download CookLinkAI.apk below and allow installing from your browser."
          files: CookLinkAI.apk
