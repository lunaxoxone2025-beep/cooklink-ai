name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CookLinkAI-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CookLinkAI-debug
          path: CookLinkAI-debug.apk

      # A release page is the easiest place to download the APK from a phone.
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CookLink AI – latest build
          prerelease: true
          make_latest: false
          body: "Debug build of commit ${{ github.sha }}. On your phone: download the APK below and allow installing from your browser."
          files: CookLinkAI-debug.apk
